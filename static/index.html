<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de Moedas</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body class="tela-centralizada">
  <div class="card cartao shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-4">💱 Conversor de Moedas</h1>

      <form id="form">
        <div class="mb-3">
          <label class="form-label">Valor</label>
          <input
            id="valor"
            type="number"
            step="0.01"
            min="0"
            class="form-control form-control-lg"
            placeholder="0,00"
            value="1"
            required
          />
        </div>

        <div class="row g-2 align-items-end">
          <div class="col">
            <label class="form-label">De</label>
            <select id="de" class="form-select"></select>
          </div>
          <div class="col-auto pb-1">
            <button type="button" id="inverter" class="btn btn-outline-secondary" title="Inverter">⇄</button>
          </div>
          <div class="col">
            <label class="form-label">Para</label>
            <select id="para" class="form-select"></select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4">Converter</button>
      </form>

      <div id="erro" class="alert alert-danger mt-3 mb-0 d-none"></div>

      <div id="resultado" class="text-center mt-4 d-none">
        <div class="text-muted small" id="origem"></div>
        <div class="resultado-valor" id="valorConvertido"></div>
        <div class="text-muted small mt-1" id="taxa"></div>
        <div class="text-muted" style="font-size: 12px;" id="atualizado"></div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
